<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">muyuchen@whu — fastfetch profile</title>
<desc id="desc">A fastfetch-style profile card with a 64-column ASCII portrait of muyuchen on the left and developer information on the right.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0f17"/><stop offset=".55" stop-color="#0d1117"/><stop offset="1" stop-color="#11131c"/>
  </linearGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3b4a63"/><stop offset=".7" stop-color="#252d3d"/><stop offset="1" stop-color="#252d3d" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glowA" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#7ee7d5" stop-opacity=".12"/><stop offset=".68" stop-color="#7ee7d5" stop-opacity=".03"/><stop offset="1" stop-color="#7ee7d5" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="1" cy="1" r=".8">
    <stop offset="0" stop-color="#7aa2f7" stop-opacity=".07"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
  </radialGradient>
  <filter id="artGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="clip"><rect width="1200" height="600" rx="24"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#glowB)"/>
  <ellipse cx="330" cy="309.2" rx="280" ry="300" fill="url(#glowA)"/>
</g>
